spring.application.name=agencia-api
server.port=8080

# MySQL de XAMPP (puerto 3306, usuario root sin contraseña).
# createDatabaseIfNotExist=true crea la base bd_agencia sola la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/bd_agencia?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
